<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Clean white background -->
  <rect width="800" height="800" fill="#ffffff"/>

  <!-- Outer frame border -->
  <rect x="50" y="50" width="700" height="700" fill="none" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>

  <!-- Top Banner: Swiss Typographic Grid & Baseline Rhythm -->
  <rect x="75" y="75" width="650" height="150" fill="none" stroke="#000000" stroke-width="6"/>
  <!-- Top bar controls -->
  <circle cx="105" cy="100" r="7" fill="#000000"/>
  <circle cx="130" cy="100" r="7" fill="#000000"/>
  <circle cx="155" cy="100" r="7" fill="#000000"/>
  <line x1="75" y1="125" x2="725" y2="125" stroke="#000000" stroke-width="5"/>
  <!-- Typographic Header -->
  <text x="185" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#000000" letter-spacing="3">SWISS EDITORIAL GRID // 8-PT RHYTHM</text>
  <!-- Grid columns -->
  <line x1="200" y1="125" x2="200" y2="225" stroke="#000000" stroke-width="4" stroke-dasharray="6 6"/>
  <line x1="330" y1="125" x2="330" y2="225" stroke="#000000" stroke-width="4" stroke-dasharray="6 6"/>
  <line x1="460" y1="125" x2="460" y2="225" stroke="#000000" stroke-width="4" stroke-dasharray="6 6"/>
  <line x1="590" y1="125" x2="590" y2="225" stroke="#000000" stroke-width="4" stroke-dasharray="6 6"/>
  <!-- Baseline lines -->
  <line x1="95" y1="150" x2="705" y2="150" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <line x1="95" y1="175" x2="705" y2="175" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <line x1="95" y1="200" x2="705" y2="200" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <!-- Specimen text in top bar -->
  <text x="100" y="170" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#000000" font-weight="bold">The quick brown fox jumps</text>

  <!-- Left Center: Large Specimen Card "Aa" in diamond / tilted frame -->
  <g transform="translate(140, 310)">
    <!-- Tilted diamond frame -->
    <rect x="-10" y="-10" width="220" height="220" rx="16" fill="none" stroke="#000000" stroke-width="6"/>
    <!-- Corner accent box -->
    <rect x="-10" y="-10" width="40" height="40" fill="#000000"/>
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">§</text>
    <!-- Big specimen letters -->
    <text x="35" y="145" font-family="'Playfair Display', Georgia, serif" font-weight="bold" font-size="120" fill="#000000">A</text>
    <text x="115" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="95" fill="#000000">a</text>
    <!-- Label -->
    <text x="100" y="185" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="13" fill="#000000" letter-spacing="2" text-anchor="middle">PLAYFAIR + GROTESK</text>
  </g>

  <!-- Speech bubble with ellipsis -->
  <g transform="translate(380, 260)">
    <path d="M 0 0 L 110 0 C 120 0 128 8 128 18 L 128 50 C 128 60 120 68 110 68 L 30 68 L 10 88 L 14 68 L 0 68 C -10 68 -18 60 -18 50 L -18 18 C -18 8 -10 0 0 0 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="35" cy="34" r="5" fill="#000000"/>
    <circle cx="55" cy="34" r="5" fill="#000000"/>
    <circle cx="75" cy="34" r="5" fill="#000000"/>
  </g>

  <!-- Right Center: Typographic Scale Matrix & Proportions -->
  <g transform="translate(420, 360)">
    <rect x="0" y="0" width="305" height="190" rx="12" fill="none" stroke="#000000" stroke-width="6"/>
    <rect x="0" y="0" width="305" height="34" fill="#000000"/>
    <text x="15" y="23" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="13" fill="#ffffff" letter-spacing="2">OPTICAL TYPE SCALE</text>
    
    <!-- Scale rows -->
    <text x="20" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#000000">H1 // 56px DISPLAY</text>
    <rect x="220" y="55" width="65" height="14" fill="#000000"/>
    
    <text x="20" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#000000">H2 // 32px SUBHEAD</text>
    <rect x="220" y="93" width="50" height="12" fill="#000000"/>

    <text x="20" y="140" font-family="'Manrope', sans-serif" font-size="14" fill="#000000">Body // 16px Leading 1.6</text>
    <rect x="220" y="130" width="40" height="10" fill="#000000"/>

    <text x="20" y="170" font-family="'JetBrains Mono', monospace" font-size="12" fill="#000000">Tabular // 13px Numbers</text>
    <rect x="220" y="162" width="30" height="8" fill="#000000"/>
  </g>

  <!-- Bottom Strip: Golden Ratio & Negative Space Composition -->
  <g transform="translate(75, 575)">
    <rect x="0" y="0" width="650" height="150" fill="none" stroke="#000000" stroke-width="6"/>
    
    <!-- Sub-frames -->
    <rect x="20" y="20" width="180" height="110" fill="none" stroke="#000000" stroke-width="4"/>
    <text x="35" y="55" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="13" fill="#000000">KERNING &amp; LEADING</text>
    <line x1="35" y1="75" x2="180" y2="75" stroke="#000000" stroke-width="3"/>
    <line x1="35" y1="95" x2="150" y2="95" stroke="#000000" stroke-width="3"/>
    <line x1="35" y1="115" x2="170" y2="115" stroke="#000000" stroke-width="3"/>

    <!-- Center: Golden Ratio spiral construct -->
    <rect x="230" y="20" width="200" height="110" fill="none" stroke="#000000" stroke-width="4"/>
    <path d="M 250 110 A 90 90 0 0 1 340 30 A 55 55 0 0 1 395 85 A 35 35 0 0 1 360 110" fill="none" stroke="#000000" stroke-width="4" stroke-dasharray="4 4"/>
    <circle cx="360" cy="110" r="5" fill="#000000"/>
    <text x="250" y="45" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#000000">φ = 1.618</text>

    <!-- Right: Swiss poster stamp -->
    <rect x="460" y="20" width="170" height="110" fill="#000000"/>
    <text x="480" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#ffffff">SWISS</text>
    <text x="480" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff">DESIGN</text>
    <text x="480" y="110" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff">ZÜRICH • 1957</text>
  </g>

  <!-- Connecting technical circuit lines & nodes -->
  <line x1="250" y1="225" x2="250" y2="300" stroke="#000000" stroke-width="5"/>
  <circle cx="250" cy="225" r="7" fill="#000000"/>
  <line x1="570" y1="225" x2="570" y2="360" stroke="#000000" stroke-width="5"/>
  <circle cx="570" cy="225" r="7" fill="#000000"/>
  <line x1="250" y1="520" x2="250" y2="575" stroke="#000000" stroke-width="5"/>
  <circle cx="250" cy="575" r="7" fill="#000000"/>
  <line x1="570" y1="550" x2="570" y2="575" stroke="#000000" stroke-width="5"/>
  <circle cx="570" cy="575" r="7" fill="#000000"/>
</svg>
